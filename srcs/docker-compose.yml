name: inception

services:
  mariadb:
    image: mariadb:inception
    build: ./requirements/mariadb
    restart: always
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
    secrets:
      - db_password

  wordpress:
    image: wordpress:inception
    build: ./requirements/wordpress
    restart: always
    depends_on:
      - mariadb
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_HOST: mariadb
    secrets:
      - db_password
      - wp_salts

networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    name: inception_mariadb_data

  wordpress_data:
    name: inception_wordpress_data

secrets:
  db_password:
    file: ../secrets/db_password.txt

  wp_salts:
    file: ../secrets/wp_salts.php
