name: inception

services:
  mariadb:
    image: mariadb:inception
    build: ./requirements/mariadb
    restart: always
    networks:
      - inception
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
    secrets:
      - db_password

  wordpress:
    image: wordpress:inception
    build: ./requirements/wordpress
    restart: always
    depends_on:
      - mariadb
    networks:
      - inception
    volumes:
      - wordpress_data:/var/www/html
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_HOST: mariadb
      DOMAIN_NAME: ${DOMAIN_NAME}
      WP_SITE_TITLE: ${WP_SITE_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER_NAME: ${WP_USER_NAME}
      WP_USER_EMAIL: ${WP_USER_EMAIL}
    secrets:
      - db_password
      - wp_salts
      - wp_admin_password
      - wp_user_password

  nginx:
    image: nginx:inception
    build: ./requirements/nginx
    restart: always
    depends_on:
      - wordpress
    networks:
      - inception
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
    secrets:
      - nginx_crt
      - nginx_key

networks:
  inception:
    driver: bridge

volumes:
  mariadb_data:
    name: inception_mariadb_data

  wordpress_data:
    name: inception_wordpress_data

secrets:
  db_password:
    file: ../secrets/db_password.txt

  wp_salts:
    file: ../secrets/wp_salts.php

  wp_admin_password:
    file: ../secrets/wp_admin_password.txt

  wp_user_password:
    file: ../secrets/wp_user_password.txt

  nginx_crt:
    file: ../secrets/nginx.crt

  nginx_key:
    file: ../secrets/nginx.key
